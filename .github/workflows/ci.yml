# Lint + test + build + types:check affected packages for the pnpm/turbo monorepo.
# Secrets required: none.
#
# Wave 60.25 — quota trim. Free-plan private-repo Actions quota is 2,000
# min/month and this workflow runs full pnpm install (~60s) + turbo
# lint/test/build (~90s) per commit. Two efficiency gates:
#   1. The job ALWAYS runs (so the required "turbo lint + test + build"
#      status is always reported and branch protection can never deadlock),
#      but the heavy steps (install + turbo) are skipped when a change
#      touches only docs (`**/*.md`, `docs/**`, `LICENSE`). A docs-only PR
#      therefore reports a green required check in a few seconds.
#      NOTE: do NOT reintroduce top-level `paths-ignore` here — that skips
#      the whole workflow, so the required check is never reported and
#      docs-only PRs stay BLOCKED forever (GitHub treats a required check
#      from a skipped workflow as permanently "expected").
#   2. `concurrency` cancels in-flight runs when a newer commit lands on
#      the same ref, so rapid pushes don't queue redundant builds.
# Và MỘT ngoại lệ đi ngược hai gate trên, cố ý đánh đổi quota lấy tính đúng:
#   3. PR đụng `.github/**` thì BỎ bộ lọc "chỉ package bị ảnh hưởng" và chạy
#      toàn bộ. Không có nó, PR sửa cấu hình CI qua cổng mà chạy 0 việc — đo
#      được ở PR #969: 46 giây, `Tasks: 0 successful, 0 total`, check vẫn xanh.
#      Chi tiết ở bước "Detect non-docs changes".
# Và MỘT việc bổ sung cố ý (Wave 60.x — thêm cổng kiểu):
#   4. Chạy luôn `types:check`. Trước đây CI chỉ lint/test/build, mà vitest
#      STRIP kiểu nên lỗi TypeScript đi lọt hoàn toàn: `pnpm types:check` ở gốc
#      repo ĐỎ suốt (TS18048 trong apps/web/src/lib/seo-guard.test.ts) trong khi
#      876 test của web vẫn xanh và CI vẫn xanh. Cổng không bắt được thứ nó phải
#      bắt thì không phải là cổng. Thêm vào CÙNG một lệnh turbo nên gần như
#      không tốn thêm quota: chạy song song, có cache, `tsc --noEmit` không
#      xuất file.
#      ⚠️ KHÔNG đổi `name:` của job bên dưới. Chuỗi "turbo lint + test + build"
#      là TÊN status check bắt buộc trong branch protection; đổi tên thì check cũ
#      không bao giờ được báo nữa và MỌI PR kẹt vĩnh viễn ở trạng thái "expected".
#      Tên job cố tình lệch với việc nó làm — đó là cái giá rẻ hơn nhiều so với
#      việc phải sửa branch protection đồng thời với lúc merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger for ad-hoc verification.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # ⚠️ ĐỪNG đổi chuỗi này — là tên status check bắt buộc (xem ghi chú 4 ở đầu
    # file). Job này giờ chạy cả `types:check`, tên cố tình giữ nguyên.
    name: turbo lint + test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history for `--filter='[origin/main]'` affected detection
          # and for the docs-only diff below.
          fetch-depth: 0

      - name: Detect non-docs changes
        id: detect
        # Sets outputs.code=true when the change touches anything other than
        # docs (**/*.md, docs/**, LICENSE). Fail-safe: any uncertainty (no
        # usable base, missing commit) → code=true so real CI always runs.
        #
        # Also sets outputs.infra=true when the change touches `.github/**`.
        # Lý do (đo được, không phải phòng xa): file trong `.github/` KHÔNG
        # thuộc package nào, nên `--filter='[origin/main]'` ở bước turbo thấy
        # 0 package bị ảnh hưởng ⇒ chạy 0 việc ⇒ check bắt buộc vẫn XANH.
        # Bằng chứng, PR #969 (sửa đúng 1 file `.github/workflows/seo-guard.yml`):
        # check "turbo lint + test + build" hết 46 giây và log ghi
        # `Tasks: 0 successful, 0 total` — trong khi một lần chạy thật mất ~4 phút.
        # Hậu quả: PR thu hẹp bộ lọc kích hoạt của seo-guard, hoặc sửa chính file
        # này, đi qua cổng mà KHÔNG chạy một bài test canh nào. Cổng tự tháo được
        # chính nó. ⇒ Đụng `.github/**` thì bỏ bộ lọc "chỉ package bị ảnh hưởng"
        # và chạy TOÀN BỘ. Đắt hơn (~4 phút thay vì ~46 giây) nhưng `.github/`
        # hiếm khi đổi, và một cổng không bao giờ chạy thì không phải là cổng.
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          CODE=true
          INFRA=true
          if [ -n "$BASE" ] \
            && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BASE" 2>/dev/null; then
            CODE=false
            INFRA=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                *.md | docs/* | LICENSE) : ;;   # docs-only → ignore
                .github/*) CODE=true; INFRA=true ;;
                *) CODE=true ;;
              esac
            done < <(git diff --name-only "$BASE" HEAD)
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "infra=$INFRA" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "true" ]; then
            echo "Non-docs changes detected → running full CI."
          else
            echo "Docs-only change → skipping heavy steps, reporting check as passed."
          fi
          if [ "$INFRA" = "true" ]; then
            echo "Đụng .github/** → bỏ bộ lọc affected, chạy TOÀN BỘ lint/test/build."
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.code == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        # pnpm version pinned via `packageManager` in package.json (pnpm@9.12.0).

      - name: Setup Node
        if: steps.detect.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.detect.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        if: steps.detect.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Turbo lint/test/build/types:check (affected)
        if: steps.detect.outputs.code == 'true'
        # Exclude `@hieu-asia/miniapp-zalo` — `zmp build` requires `zmp login`
        # (Zalo developer portal auth) which CI cannot perform. Local devs
        # build it manually after `zmp login`.
        # Hệ quả đã biết: bộ lọc này gạt zalo khỏi CẢ lint/test/types:check chứ
        # không riêng build, nên package đó hiện không có cổng CI nào. Lỗ hổng
        # có từ trước, không phải do thêm types:check; tách ra xử lý riêng.
        run: |
          FILTER='--filter=!@hieu-asia/miniapp-zalo'
          # PR thường: chỉ chạy package bị ảnh hưởng (tiết kiệm quota).
          # PR đụng `.github/**`: bỏ lọc, chạy hết — xem lý do dài ở bước detect.
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && [ "${{ steps.detect.outputs.infra }}" != "true" ]; then
            pnpm turbo lint test build types:check "$FILTER" --filter='[origin/main]'
          else
            pnpm turbo lint test build types:check "$FILTER"
          fi
