# Wave 60.42 — Chromatic visual regression CI.
#
# Catches color/layout regressions automatically by snapshotting every story
# on every PR and diffing against the baseline. Triggered by the same kind
# of bug that prompted Wave 60.41 (Button disabled state cream-on-cream
# invisible on /signin light mode).
#
# Chromatic free tier: 5000 snapshots/mo. With ~5 stories × theme switcher
# (light+dark) × 5 PRs/week = ~100 snapshots/week = ~400/mo. Well under cap.
#
# Setup steps for founder (one-time, ~3 min):
# 1. Go to chromatic.com → sign in with GitHub
# 2. Create project linked to nguyenhieuisocial/hieu-asia-frontend
# 3. Copy project token
# 4. Add to repo secrets: Settings → Secrets → Actions → add
#    CHROMATIC_PROJECT_TOKEN
# 5. First push to main runs baseline build; subsequent PRs auto-diff.

name: Chromatic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write   # Chromatic posts a comment on PRs

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chromatic skips PRs from forks (no secret access) — that's fine for
    # a private repo with no external contributors.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # Chromatic needs full history to baseline

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        working-directory: apps/web
        run: pnpm build-storybook

      # ⛔ CHƯA CẤU HÌNH = ĐỎ (cố ý, sửa 2026-07-31).
      #
      # Wave 60.51.b đã bọc bước dưới bằng một "Check Chromatic token" +
      # `if: steps.token_check.outputs.has_token == 'true'`, để khi thiếu
      # CHROMATIC_PROJECT_TOKEN thì workflow chỉ in warning rồi thoát XANH.
      #
      # Hậu quả thật (bắt tại trận 2026-07-31): secret chưa bao giờ được đặt,
      # nên bước publish luôn ở trạng thái `skipped` — 96 XANH / 0 ĐỎ trong 100
      # lần chạy gần nhất, mà KHÔNG một ảnh chụp giao diện nào từng được chụp
      # hay so sánh. Cổng chống lỗi giao diện đã "bảo vệ" suốt nhiều tháng bằng
      # cách không làm gì cả. Một bước bị `if:` bỏ qua vẫn được tính là pass →
      # dấu tích xanh nói dối.
      #
      # Nay không còn cổng chặn: `chromaui/action` tự lỗi "Missing project
      # token" khi thiếu secret. Đỏ = "hãy cấu hình tôi" (xem 5 bước ở đầu
      # file), trung thực hơn hẳn một dấu tích xanh vô nghĩa.
      - name: Publish to Chromatic
        uses: chromaui/action@14cfaef73576e69f95f47f60058063f46ca38719 # v17
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/web
          storybookBuildDir: storybook-static
          # Don't fail CI on visual changes — let humans review the
          # Chromatic UI to accept/reject. Build fails only on technical
          # errors (build break, missing token).
          exitZeroOnChanges: true
          onlyChanged: true   # Turbo-snap: only re-snap stories whose
                              # dependencies actually changed
