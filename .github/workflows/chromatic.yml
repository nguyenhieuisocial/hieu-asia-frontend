# Storybook build CI — kèm Chromatic KHI đã cấu hình.
#
# ─── Vì sao cổng này đổi tên (01/08/2026) ────────────────────────────────────
# Wave 60.42 dựng nó làm cổng "Visual regression": chụp ảnh mọi story rồi so
# với ảnh nền để bắt lỗi màu/bố cục.
#
# Nhưng CHROMATIC_PROJECT_TOKEN chưa bao giờ được đặt, nên:
#   • Trước 31/07: bước publish bị `if:` bỏ qua ⇒ 96 XANH / 0 ĐỎ trong 100 lần
#     chạy gần nhất mà KHÔNG một ảnh nào được chụp. Dấu tích xanh nói dối (#1019
#     đã gỡ cái `if:` đó).
#   • Sau 31/07: mọi PR đeo dấu X ĐỎ vĩnh viễn. Đo ngày 01/08: cả 4 PR đang mở
#     đều đỏ ở đúng mục này và phải mở từng cái ra mới biết nó không liên quan
#     gì tới code trong PR. Đỏ mãn tính mà không nói được lý do thì rồi cũng bị
#     làm ngơ — cùng căn bệnh, chỉ đổi dấu.
#
# Nay cổng khai đúng việc nó THẬT SỰ làm: **dựng Storybook** (22 file story —
# bắt được story hỏng, component vỡ khi build). Việc đó không cần token nên
# xanh/đỏ đều là tín hiệu thật. Chromatic chỉ là phần THÊM: có token thì publish,
# chưa có thì in ::notice:: nói rõ đang thiếu gì — không giả vờ đã kiểm ảnh.
#
# ─── Bật kiểm ảnh giao diện thật (một lần, ~3 phút, chỉ founder làm được) ─────
# 1. chromatic.com → đăng nhập bằng GitHub
# 2. Tạo project trỏ tới nguyenhieuisocial/hieu-asia-frontend
# 3. Copy project token
# 4. Settings → Secrets → Actions → thêm CHROMATIC_PROJECT_TOKEN
# 5. Lần push main kế tiếp dựng ảnh nền; từ đó mỗi PR tự so ảnh.
# Không phải sửa file này — bước publish tự chạy ngay khi secret có mặt.
# Muốn cổng ĐỎ trở lại khi thiếu token thì đổi `::notice::` + `exit 0` dưới cùng
# thành `::error::` + `exit 1`.

name: Storybook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write   # Chromatic posts a comment on PRs

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    # Tên = việc THẬT SỰ làm. Chưa có token thì đây thuần là cổng dựng Storybook;
    # có token thì kèm luôn kiểm ảnh giao diện.
    name: Storybook build (+ Chromatic khi đã cấu hình)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chromatic skips PRs from forks (no secret access) — that's fine for
    # a private repo with no external contributors.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # Chromatic needs full history to baseline

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      # Bước "hỏng sớm nếu thiếu token" (#1042) đã bỏ: nó đúng khi cổng còn mang
      # tên "Visual regression" — khai kiểm ảnh mà không kiểm thì phải đỏ. Nay
      # cổng khai đúng là dựng Storybook, việc đó KHÔNG cần token, nên đỏ vì
      # thiếu token sẽ thành đỏ sai. Chỗ báo thiếu token chuyển xuống cuối file
      # dưới dạng ::notice:: (xem bước "Publish to Chromatic").
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        working-directory: apps/web
        run: pnpm build-storybook

      # ĐỌC KỸ TRƯỚC KHI SỬA — chỗ này đã sai hai lần theo hai hướng ngược nhau.
      #
      # Lần 1 (Wave 60.51.b): cổng tên "Visual regression" + `if:` bỏ qua bước
      # publish khi thiếu token ⇒ 96 XANH / 0 ĐỎ trong 100 lần chạy mà KHÔNG một
      # ảnh nào được chụp. Dấu tích xanh nói dối.
      # Lần 2 (#1019, 31/07): gỡ `if:` ⇒ mọi PR đỏ vĩnh viễn vì một lỗi cấu hình
      # không liên quan gì tới PR. Đỏ mãn tính rồi cũng bị làm ngơ.
      #
      # Cách thoát không nằm ở cái `if:`, mà ở chỗ CỔNG KHAI ĐÚNG VIỆC NÓ LÀM.
      # Cổng nay tên "Storybook build", không hứa kiểm ảnh — nên bỏ qua bước
      # publish là trung thực, không phải nói dối. Chromatic là phần THÊM.
      #
      # ⚠️ Ràng buộc: `if:` dưới đây CHỈ hợp lệ chừng nào tên job còn là
      # "Storybook build...". Nếu ai đó đổi tên job về "Visual regression" thì
      # phải bỏ `if:` này — bằng không lỗi lần 1 tái diễn nguyên xi.
      - name: Kiểm tra token Chromatic
        id: token
        env:
          TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Kiểm ảnh giao diện ĐANG TẮT::Storybook đã dựng xong (đó là việc cổng này khai và nó đã làm), nhưng CHƯA có ảnh giao diện nào được chụp hay so sánh vì thiếu secret CHROMATIC_PROJECT_TOKEN. Bật (một lần, ~3 phút): 1) chromatic.com đăng nhập bằng GitHub 2) tạo project trỏ tới nguyenhieuisocial/hieu-asia-frontend 3) copy project token 4) Settings > Secrets > Actions > thêm CHROMATIC_PROJECT_TOKEN. Không phải sửa file workflow."
          fi

      - name: Publish to Chromatic
        if: steps.token.outputs.has == 'true'
        uses: chromaui/action@14cfaef73576e69f95f47f60058063f46ca38719 # v17
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/web
          storybookBuildDir: storybook-static
          # Don't fail CI on visual changes — let humans review the
          # Chromatic UI to accept/reject. Build fails only on technical
          # errors (build break, missing token).
          exitZeroOnChanges: true
          onlyChanged: true   # Turbo-snap: only re-snap stories whose
                              # dependencies actually changed
