# SEO metadata guard (vault 172) — đo <title> + meta description + JSON-LD trên
# HTML mà `next build` sinh ra, tức đúng thứ Google thấy, KHÔNG đọc chuỗi trong
# source.
#
# Vì sao phải build mới đo được: đợt SEO 2026-07-25 có PR rút chữ theo chuỗi
# trong source, quên mất 12 ký tự hậu tố " · hieu.asia" mà root layout tự nối
# vào <title> — nên "sửa xong" mà trang vẫn vượt ngưỡng, và không ai biết.
#
# HAI CỔNG HIỆU SUẤT — cùng khuôn với ci.yml:
#   1. Job LUÔN CHẠY (nên check luôn báo kết quả và branch protection không bao
#      giờ deadlock), nhưng các bước nặng (install + build + guard) chỉ chạy khi
#      diff có đụng thứ có thể làm hỏng meta. PR không liên quan báo xanh trong
#      vài giây.
#      ⚠️ KHÔNG được đưa `paths:` lên cấp workflow. Làm thế là bỏ qua CẢ
#      workflow, check không bao giờ báo, và nếu nó là required thì mọi PR
#      không liên quan BLOCKED VĨNH VIỄN (GitHub coi required check của một
#      workflow bị skip là "expected" mãi mãi). Bản đầu của file này mắc đúng
#      lỗi đó — cùng cái bẫy mà `ci.yml` đã ghi chú sẵn.
#   2. `concurrency` huỷ run cũ khi có commit mới trên cùng ref.
#
# Chạy cả trên `push: main` để bắt trôi lệch SAU khi gộp: hai PR xanh riêng lẻ
# vẫn có thể hỏng khi vào chung main, mà chỉ chạy trên pull_request thì không ai
# đo lại trạng thái main.
#
# ⛔ ĐÃ LÀ REQUIRED CHECK (bật 2026-07-25), tên trong branch protection là
# "seo-guard (vault 172)" — vi phạm CHẶN merge, không còn advisory. Sửa job này
# (đổi tên job, đổi bộ lọc RELEVANT, cho phép fail) là đụng vào cổng chặn của
# main: đọc kỹ trước khi đổi.
name: seo-guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: seo-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-guard:
    name: seo-guard (vault 172)
    runs-on: ubuntu-latest
    # Job này giờ có khởi động server → phải có trần riêng. Mặc định của GitHub
    # là 360 phút; một route treo lúc render có thể đốt hàng giờ Actions.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Cần lịch sử để diff với base branch ở bước dò bên dưới.
          fetch-depth: 0

      - name: Detect metadata-affecting changes
        id: detect
        # Đặt outputs.relevant=true khi diff đụng thứ có thể đổi <title>,
        # description hoặc JSON-LD. Fail-safe: bất kỳ chỗ nào không chắc (không
        # có base dùng được, thiếu commit) → relevant=true để guard vẫn chạy.
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          RELEVANT=true
          if [ -n "$BASE" ] \
            && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BASE" 2>/dev/null; then
            RELEVANT=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                # LẤY TRỌN `apps/web/src` — cố ý KHÔNG liệt kê hẹp nữa.
                #
                # Bản cũ chỉ lấy `app/**page.tsx`, `app/**layout.tsx`, `lib/**`,
                # `components/seo/**`. Lỗ hổng có thật: `components/tools/`
                # `ToolPageShell.tsx` dựng thẻ <h1> cho hàng chục trang công cụ,
                # mà guard CÓ luật canh <h1> — sửa nhầm ở đó thì guard IM LẶNG
                # bỏ qua, CI báo xanh, lỗi vào thẳng main. Còn sót cả nhóm file
                # trong `app/` không theo quy ước (form, trang lỗi, 404).
                #
                # Lý do cũ để liệt kê hẹp là sợ tốn quota Actions — nhưng quyết
                # định đó đưa ra mà KHÔNG ĐO. Đo trên 60 commit gần nhất của
                # main: nới từ danh sách hẹp lên trọn `src` chỉ thêm ~4 lần chạy
                # (+7%), vì PR đụng component/form hầu như luôn đụng kèm page
                # hoặc lib. Đổi ~40 phút Actions mỗi tháng lấy việc danh sách
                # này KHÔNG THỂ MỤC — rẻ hơn nhiều một lỗi lọt production vì
                # guard không chạy.
                #
                # `seo-guard-trigger.guard.test.ts` canh chính khối này: file
                # nào dựng <h1> / dữ liệu có cấu trúc / metadata mà không khớp
                # mẫu nào ở đây thì test đỏ.
                apps/web/src/*) RELEVANT=true ;;
                # Chính guard và workflow của nó.
                # ⚠️ PHẢI CÓ CẢ `seo-live.mjs`: workflow này GỌI nó ở bước cuối.
                # Thiếu dòng đó thì một PR chỉ sửa `seo-live.mjs` — nới ngưỡng
                # chịu lỗi, thêm mẫu bỏ qua, đổi `tachBoQua` — sẽ KHÔNG chạy
                # bước đo nào và báo xanh trong vài giây. Đúng cái bẫy mà khối
                # chú thích phía trên tự hào đã bịt, mà chính nó lại sập vào.
                apps/web/scripts/seo-guard.mjs | apps/web/scripts/seo-live.mjs | .github/workflows/seo-guard.yml) RELEVANT=true ;;
                # Nâng Next có thể đổi hình dạng HTML → chết regex đọc thẻ.
                apps/web/package.json | pnpm-lock.yaml) RELEVANT=true ;;
                *) : ;;
              esac
            done < <(git diff --name-only "$BASE" HEAD)
          fi
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"
          if [ "$RELEVANT" = "true" ]; then
            echo "Có thay đổi ảnh hưởng metadata → chạy guard."
          else
            echo "Không đụng metadata → bỏ qua build, báo xanh."
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.relevant == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        # pnpm version pinned via `packageManager` in package.json.

      - name: Setup Node
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.detect.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build web
        if: steps.detect.outputs.relevant == 'true'
        run: pnpm --filter web build

      - name: Guard SEO metadata
        if: steps.detect.outputs.relevant == 'true'
        run: node apps/web/scripts/seo-guard.mjs

      # ─────────────────────────────────────────────────────────────────────
      # Bịt điểm mù CHÍNH của bước trên: `seo-guard.mjs` chỉ đọc `*.html` do
      # build sinh ra, mà 49/978 URL trong sitemap thuộc 15 route RENDER ĐỘNG
      # nên không có `.html` ⇒ nó không thấy. Đó là lý do 4 trang vượt ngưỡng
      # nằm im nhiều tuần trong khi CI xanh (chi tiết: vault 172 mục 16).
      #
      # Cách bịt: dựng xong thì CHẠY THẬT bản dựng rồi đo qua sitemap bằng
      # chính `seo-live.mjs` — đo đúng thứ Google thấy, không đoán chuỗi trong
      # source. Đã kiểm cục bộ: 49/49 trang động render được, 978/978 đo được.
      # Rẻ vì tái dùng bản dựng vừa có; tốn thêm ~1 phút.
      - name: Đo SEO trên bản dựng đang chạy (phủ cả trang động)
        if: steps.detect.outputs.relevant == 'true'
        run: |
          set +e
          pnpm --filter web exec next start -p 3000 > /tmp/next-ci.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q 'Ready in' /tmp/next-ci.log && break
            sleep 1
          done
          if ! grep -q 'Ready in' /tmp/next-ci.log; then
            echo "::warning::Không dựng nổi server để đo trang động — bỏ qua bước này."
            tail -20 /tmp/next-ci.log
            # Ghi cả vào job summary: `::warning::` trên một check XANH rất dễ
            # chìm. Nếu bước này hỏng liên tục thì suốt thời gian đó KHÔNG có
            # URL động nào được đo mà mọi check vẫn xanh — đúng loại "chốt canh
            # thôi kiểm trong im lặng" mà cả PR này sinh ra để chống.
            {
              echo "### ⚠️ seo-live KHÔNG chạy được"
              echo "Không dựng nổi \`next start\` trong 60s ⇒ **49 URL render động không được đo lượt này**."
              echo "Chốt bù duy nhất là workflow \`seo-live\` chạy theo lịch hằng ngày."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # ⚠️ BỎ QUA 3 cụm gọi mạng RA NGOÀI lúc render (`/cam-nang` gọi API
          # nội dung, `/tu-vi-hom-nay` gọi hieu.asia, `/hop-tuoi` cũng có).
          # Nếu đo chúng ở đây thì: ① API chập → trang trả 404 → bị tính là VI
          # PHẠM → mã 1 → CHẶN MỌI PR kể cả PR chỉ sửa CSS; ② nội dung lấy từ
          # PRODUCTION nên phép đo chẳng nói gì về bản dựng của PR.
          # Chúng vẫn được lượt chạy theo lịch trên production phủ — ở đó phép
          # đo mới có nghĩa. Sàn sitemap vẫn chạy trên DANH SÁCH ĐẦY ĐỦ.
          # `/x/*` = cả nhánh; không có `/*` = ĐÚNG một đường dẫn. Phân biệt này
          # quan trọng: `/hop-tuoi` có 83 URL nhưng chỉ 3 trang là động — viết
          # `/hop-tuoi` kiểu tiền tố sẽ loại nhầm 80 trang TĨNH đang đo tốt.
          # (Tôi đã sập đúng vào đó lúc diễn thử; nay `kiemBoQua` chặn luôn ca
          # danh sách bỏ qua phình quá 5%.)
          node apps/web/scripts/seo-live.mjs http://127.0.0.1:3000 \
            '--bo-qua=/cam-nang/*,/tu-vi-hom-nay/*,/hop-tuoi/business,/hop-tuoi/birth-child,/hop-tuoi/xong-dat' \
            --chiu-loi=2
          MA=$?
          kill %1 2>/dev/null
          # Mã 1 = vi phạm SEO THẬT        ⇒ CHẶN (đây là required check).
          # Mã 3 = lỗi của chính PR này    ⇒ CHẶN (sitemap teo mất cả cụm, hoặc
          #        danh sách bỏ qua ăn quá rộng). Để chung mã 2 thì hai ca đó
          #        thành advisory và merge được — tức chốt canh tự vô hiệu.
          # Mã 2 = hạ tầng (mạng chập, cổng bận…) ⇒ chỉ cảnh báo, vì đó không
          #        phải lỗi của người mở PR. Nhưng KHÔNG im: ::warning:: nổi lên
          #        tóm tắt của run.
          if [ "$MA" = "2" ]; then
            echo "::warning::seo-live thoát mã 2 (hạ tầng) — chưa kết luận được về SEO, xem log."
            exit 0
          fi
          exit $MA
